openapi: 3.1.0
info:
  title: selfhost API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    REST API of the selfhost server. Every route except `GET /setup/status`, `POST /setup`,
    `POST /auth/login`, `GET /invites/{token}`, `POST /invites/{token}/accept`,
    `POST /auth/password-reset/request`, `POST /auth/password-reset/confirm`, `POST /auth/agent/request-code`,
    `POST /auth/agent/verify-code` and `GET /access/handoff` needs authentication, and every unknown path returns
    401 without credentials and 404 with them.

    Authenticate with `Authorization: Bearer <api key>` or with the session cookie that setup and
    login set. The cookie is named `session` over plain HTTP and `__Host-session` over HTTPS. Requests
    authenticated by cookie that change state must also send an `X-Requested-With` header (any non-empty
    value) and an `Origin` header that matches the request host. API key requests skip both checks.

    A resource the user cannot see returns 404 `not_found`. A resource the user can see but whose role does
    not allow the action returns 403 `forbidden`.

    Request and response bodies are JSON, except file uploads and downloads. Request bodies must use
    `Content-Type: application/json`, must stay under 16 KiB (publish manifests may be up to 16 MiB, access
    settings up to 512 KiB) and must not contain unknown fields.

    Publishing takes three calls: `POST /publish` (new site) or `PUT /publish/{slug}` (new version) with a file
    manifest, one `PUT` per file to the returned upload URLs, then `POST .../finalize`. A version serves
    nothing until finalize succeeds.

    A site can also be served at custom domains the owner proves they control with a DNS TXT record (see the
    Domains tag). A domain serves nothing until its TXT record has been verified.

    The server also serves the dashboard, a single page app, on the management host at every path outside
    `/api/`, `/s/` and `/.well-known/`. Those files are public static files and hold nothing specific to the
    instance.

    Published sites are not part of this API. The server serves a site's live version at
    `https://{slug}.{baseDomain}/` (subdomain mode) and at `{publicUrl}/s/{slug}/` (path mode). A site is open
    to anyone with the link unless its access mode says otherwise (see the Access tag). Each site response
    carries the URL the instance serves it at right now in `url`, and its access mode in `accessMode`.

    Every route except `GET /setup/status`, `POST /setup`, `POST /auth/login`, `GET /invites/{token}`,
    `POST /invites/{token}/accept`, the two `/auth/password-reset/*` routes, the two `/auth/agent/*` routes and
    `GET /access/handoff` needs credentials. `GET /access/handoff` answers a caller without credentials with a
    redirect to `/login`.

    Email is optional. The root user configures it in the instance settings (`email.*`). Routes that depend on it
    check it at request time and degrade as their descriptions say.

    **Agents.** An agent without credentials can ask the user for an email code (`/auth/agent/request-code`,
    then `/auth/agent/verify-code`), which returns an API key. When the instance has no email, `request-code`
    returns 409 `email_not_configured`, and the user must create an API key in the dashboard under Settings,
    API keys, and give it to the agent. Store the key at `~/.selfhost/credentials` (the directory mode 0700, the
    file mode 0600) as JSON, `{"url": "<instance URL>", "key": "<API key>"}`, and read that file at the start of
    every session before asking the user for access again.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Setup
    description: First-run setup of a new instance.
  - name: Auth
    description: Sign-in, sign-out, password reset and agent sign-in.
  - name: Account
    description: The signed-in user and their API keys.
  - name: Instance
    description: Facts about this instance and its built-in documentation.
  - name: Workspaces
    description: Personal and shared workspaces.
  - name: Members
    description: Roles and scoped grants inside a workspace.
  - name: Folders
    description: Flat folders that group sites in a workspace.
  - name: Sites
    description: Listing, reading, changing and deleting sites, and reading their live files.
  - name: Publish
    description: Creating versions, uploading files, finalizing, restoring and deleting versions.
  - name: Access
    description: Per-site access modes and the sign-in handoff for viewers.
  - name: Domains
    description: Custom domains and their DNS verification.
  - name: Invites
    description: Invitations that create instance accounts.
  - name: Hosting
    description: Which hosting modes are on and whether they work.
  - name: Analytics
    description: Cookieless page view reports.
  - name: Admin
    description: Instance settings and user management. Root user only.
paths:
  /setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Report whether first-time setup is still needed
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup:
    post:
      tags: [Setup]
      operationId: setup
      summary: Create the root user and sign in
      description: |
        Works only while the instance has no users. The server logs the setup token once at startup.
        Success discards the token and sets the session cookie. Rate limited per IP address and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Root user created.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The setup token is missing or wrong (`invalid_setup_token`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup is already complete (`setup_complete`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerBusy"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Sets the session cookie. Sessions last 30 days and renew on use. A wrong password, an unknown
        email and a malformed email all return the same response. Rate limited per IP address, and by failed attempts per IP address and email pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong email or password (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The password is right but the account is disabled (`account_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerBusy"
  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Ask for a password reset link by email
      description: |
        The response is the same for every address and every instance state. The server emails a one-time link
        (`PUBLIC_URL/reset-password/<token>`, valid for one hour) only when email is configured and the address
        belongs to an enabled account. Rate limited per IP address (5 in 15 minutes) and per email address
        (3 per hour). Every request counts, whether or not the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset link
      description: |
        A link works once and for one hour. Success ends every session of the user and keeps their API keys.
        It does not sign anyone in. A short password returns 400 `validation_failed` and leaves the link usable.
        Rate limited per IP address (10 in 15 minutes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: The password changed.
        "400":
          description: |
            The request was rejected: `invalid_reset_token` (unknown, expired, used or superseded link, all
            identical), or one of the codes under BadRequest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerBusy"
  /auth/agent/request-code:
    post:
      tags: [Auth]
      operationId: requestAgentCode
      summary: Ask the user to approve an agent with an emailed code
      description: |
        For agents that have no credentials. When email is configured, the response is the same for every address,
        and the server emails an 8-digit code (valid for 10 minutes, single use) only to an existing, enabled
        account. The user then gives the code to the agent, which calls `/auth/agent/verify-code`. Rate limited per
        IP address (10 in 15 minutes), per email address (3 per hour) and for the whole instance (100 per hour).

        When the instance cannot send email, this route returns 409 `email_not_configured`. That is the one place
        the API reveals whether email works. The message tells the agent to ask the user for an API key created in
        the dashboard under Settings, API keys.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequestCode"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The instance has no working email (`email_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/agent/verify-code:
    post:
      tags: [Auth]
      operationId: verifyAgentCode
      summary: Trade an emailed code for an API key
      description: |
        Returns a new API key with the full access of the user, once. A code works once, expires after 10 minutes
        and allows 5 attempts. Unknown addresses, disabled accounts, wrong codes and expired codes all return the
        same 400 `invalid_code`. The 50 active keys per user limit applies (409 `api_key_limit_reached`), and the
        code is spent by then. Rate limited per IP address (20 in 15 minutes) and per email address (10 in 15
        minutes). Store the key where `credentialsPath` says.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentVerifyCode"
      responses:
        "201":
          description: Key created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKey"
        "400":
          description: |
            The request was rejected: `invalid_code`, `validation_failed` (a bad label) or one of the codes under
            BadRequest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The user already has 50 active keys (`api_key_limit_reached`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      description: Deletes the session behind the cookie and clears the cookie. With an API key it only clears the cookie.
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the signed-in user
      responses:
        "200":
          description: The user and how the request authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /me/keys:
    get:
      tags: [Account]
      operationId: listApiKeys
      summary: List the user's API keys
      description: Returns active and revoked keys, newest first. Never includes the key itself.
      responses:
        "200":
          description: API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Account]
      operationId: createApiKey
      summary: Create an API key
      description: |
        The response is the only time the full key is shown. A user can hold 50 active keys.
        A key has the full access of its user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Key created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "409":
          description: The user already has 50 active keys (`api_key_limit_reached`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /me/keys/{id}:
    delete:
      tags: [Account]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Revoking an already revoked key succeeds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Key revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          description: The key does not exist or belongs to another user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /instance:
    get:
      tags: [Instance]
      operationId: getInstance
      summary: Describe the instance for a signed-in user
      description: |
        Facts a client needs to set itself up: the public URL, the version, whether the instance can send email,
        which hosting modes are on, the per-site custom domain limit, who may invite, whether the caller may create
        shared workspaces (the `workspaces.whoCanCreate` setting) and where agents keep their credentials. It holds nothing only the
        root user may see.
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /docs/openapi.yaml:
    get:
      tags: [Instance]
      operationId: getOpenApiDocument
      summary: Download this OpenAPI document
      description: The document the running server was built with. Needs a signed-in user or an API key.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /docs/agent-guide.md:
    get:
      tags: [Instance]
      operationId: getAgentGuide
      summary: Download the guide for agents
      description: |
        A Markdown guide that tells an agent how to authenticate, publish a folder and manage sites. Needs a
        signed-in user or an API key.
      responses:
        "200":
          description: The guide.
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List the workspaces the user can reach
      description: |
        Returns the personal workspace first, then shared workspaces. A workspace appears when the user holds
        any grant in it, including grants limited to one folder or one site. `role` is the highest workspace-wide
        role. When the user has only scoped grants, `scopedOnly` is true and `role` is `read`.
      responses:
        "200":
          description: Workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a shared workspace
      description: The creator becomes its workspace-wide admin. When `slug` is omitted, the server derives it from the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "409":
          description: The slug is already taken (`slug_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /workspaces/{workspace}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get a workspace
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workspaces]
      operationId: renameWorkspace
      summary: Rename a workspace
      description: Needs a workspace-wide admin role. The slug never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameWorkspaceRequest"
      responses:
        "200":
          description: The renamed workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete a shared workspace
      description: Needs a workspace-wide admin role. Deletes the workspace's folders and grants. Refused while the workspace contains sites.
      responses:
        "204":
          description: Workspace deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The workspace is personal (`personal_workspace`) or still contains sites (`workspace_not_empty`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /workspaces/{workspace}/members:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Members]
      operationId: listMembers
      summary: List the grants in a workspace
      description: Needs a workspace-wide admin role. A user with several grants appears once per grant.
      responses:
        "200":
          description: Grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Members]
      operationId: addMember
      summary: Grant a user access to a workspace
      description: |
        Needs a workspace-wide admin role. The user must already have an account and is found by email.
        A grant covers the whole workspace, one folder or one site. Admin applies to the whole workspace only.
        A user can hold several scoped grants, but only one grant per scope. Personal workspaces take no members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Grant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            The workspace, folder or site does not exist or is not visible (`not_found`), or no user has that
            email (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The user already holds this grant (`member_exists`) or the workspace is personal (`personal_workspace`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /workspaces/{workspace}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: memberId
        in: path
        required: true
        description: The grant id from the member list.
        schema:
          type: string
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Change the role of a grant
      description: |
        Needs a workspace-wide admin role. The scope of a grant cannot change: remove it and add a new one.
        The last workspace-wide admin of a workspace cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: The updated grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The change would leave no workspace-wide admin (`last_admin`) or the workspace is personal
            (`personal_workspace`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a grant
      description: Needs a workspace-wide admin role. The last workspace-wide admin cannot be removed.
      responses:
        "204":
          description: Grant removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The grant belongs to the last workspace-wide admin (`last_admin`) or the workspace is personal
            (`personal_workspace`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /workspaces/{workspace}/folders:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Folders]
      operationId: listFolders
      summary: List the folders the user can see
      description: Ordered by name. A user with only scoped grants sees only the folders those grants cover.
      responses:
        "200":
          description: Folders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Folders]
      operationId: createFolder
      summary: Create a folder
      description: |
        Needs a workspace-wide write or admin role. Folders are flat, and names are unique per workspace
        regardless of case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderRequest"
      responses:
        "201":
          description: Folder created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A folder with that name exists (`folder_name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /workspaces/{workspace}/folders/{folder}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: folder
        in: path
        required: true
        description: The folder id.
        schema:
          type: string
    patch:
      tags: [Folders]
      operationId: renameFolder
      summary: Rename a folder
      description: Needs a workspace-wide write or admin role. A grant limited to the folder is not enough.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderRequest"
      responses:
        "200":
          description: The renamed folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A folder with that name exists (`folder_name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Folders]
      operationId: deleteFolder
      summary: Delete a folder
      description: |
        Needs a workspace-wide admin role. A grant limited to the folder is not enough, whatever its role. The
        folder's sites stay in the workspace as unfiled sites. Grants limited to the folder are removed with it,
        so the call fails with 409 `folder_has_grants` while any exist. Pass `force=true` to delete the folder
        and those grants anyway.
      parameters:
        - name: force
          in: query
          required: false
          description: Delete the folder even when grants limited to it exist.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Folder deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Grants limited to the folder still exist (`folder_has_grants`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /workspaces/{workspace}/sites:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      tags: [Sites]
      operationId: createSite
      summary: Create an empty site
      description: |
        Needs a workspace-wide write or admin role, or write on the target folder. A user with write on one
        folder can create sites in that folder only. The site holds no files yet. When `slug` is omitted, the
        server generates a readable one such as `quiet-meadow-k3p7`. The slug cannot change afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: Site created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another site on the instance already uses the slug (`slug_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List every site the user can reach
      description: |
        Spans all workspaces. Sites come newest first. Paging uses an opaque cursor: pass `nextCursor` from a
        response as `cursor` to get the next page. `nextCursor` is null on the last page. Sites created while
        paging do not shift later pages. Search matches the display name and the slug without regard to case
        (SQLite folds ASCII letters only).
      parameters:
        - name: workspace
          in: query
          description: Limit the list to one workspace, by slug or id.
          schema:
            type: string
        - name: folder
          in: query
          description: A folder id, or `none` for unfiled sites.
          schema:
            type: string
        - name: q
          in: query
          description: Search text.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /sites/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: The site slug or id.
        schema:
          type: string
    get:
      tags: [Sites]
      operationId: getSite
      summary: Get a site
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sites]
      operationId: updateSite
      summary: Edit a site
      description: |
        Needs write on the site. Omitted fields stay as they are. `folderId: null` moves the site to unfiled,
        which needs a workspace-wide write role. Moving to a folder needs write on that folder. A site cannot
        move to another workspace, and its slug cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteRequest"
      responses:
        "200":
          description: The updated site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Sites]
      operationId: deleteSite
      summary: Delete a site
      description: Needs write on the site. Removes the site record and any grants limited to it.
      responses:
        "204":
          description: Site deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /publish:
    post:
      tags: [Publish]
      operationId: publishNewSite
      summary: Create a site and a pending version
      description: |
        Starts a publish to a new site. The body lists every file with its size, SHA-256 and content type. The
        server creates the site, records a pending version and returns one upload URL per file. Upload each
        file with `PUT`, then call finalize. Nothing is live until finalize succeeds.

        The workspace comes from `workspace` in the body (slug or id), then from the `X-Workspace` header, then
        defaults to the caller's personal workspace. Creating a site needs a workspace-wide write or admin role,
        or write on the target `folder` when the grant is scoped to it. `folder` accepts a folder id or a name.

        A pending version that is not finalized within 24 hours expires and a maintenance task deletes it.
        Manifests may be up to 16 MiB of JSON.
      parameters:
        - name: X-Workspace
          in: header
          required: false
          description: The workspace slug or id. The `workspace` body field takes precedence.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "201":
          description: Site and pending version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          $ref: "#/components/responses/PublishInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another site on the instance already uses the slug (`slug_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PublishTooLarge"
        "429":
          $ref: "#/components/responses/TooManyPending"
        "415":
          $ref: "#/components/responses/BadRequest"
  /publish/{slug}:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
    put:
      tags: [Publish]
      operationId: publishNewVersion
      summary: Create a pending version of an existing site
      description: |
        Needs write on the site. The body lists every file of the new version, not only the changed ones.
        With `baseVersionId`, the call fails with 409 `version_conflict` when the site's live version is not
        that id, and finalize checks it again so two racing publishes cannot both win. A version created with
        a base that goes stale before finalize stays pending and can never finalize, so start a new one.
        Without `baseVersionId`, finalize overwrites whatever is live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepublishRequest"
      responses:
        "201":
          description: Pending version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          $ref: "#/components/responses/PublishInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "413":
          $ref: "#/components/responses/PublishTooLarge"
        "429":
          $ref: "#/components/responses/TooManyPending"
        "415":
          $ref: "#/components/responses/BadRequest"
  /publish/{slug}/versions:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
    get:
      tags: [Publish]
      operationId: listVersions
      summary: List versions of a site
      description: |
        Needs read on the site. Returns pending and finalized versions, newest first, up to 200. `live` is true
        for the version the site currently serves.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /publish/{slug}/versions/{versionId}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
      - $ref: "#/components/parameters/VersionId"
      - name: path
        in: path
        required: true
        description: |
          The file path from the manifest, with each segment URL-encoded and the segments joined by `/`.
        schema:
          type: string
    put:
      tags: [Publish]
      operationId: uploadVersionFile
      summary: Upload one file of a pending version
      description: |
        Needs write on the site. The request body is the raw file content, whatever its `Content-Type`. The server
        streams it to a temporary file, checks the size and SHA-256 against the manifest, then moves it into place.
        A rejected upload stores nothing. Uploading the same path again replaces it while the version is pending.
        The body may not exceed `limits.maxFileBytes`. The version directory never changes after finalize.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File stored and verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEnvelope"
        "400":
          description: |
            The path is invalid (`invalid_path`), or the body does not match the manifest (`size_mismatch`,
            `hash_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            The site or version is not visible to the caller (`not_found`), or the path is not in the manifest
            (`file_not_in_manifest`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The version is already finalized (`version_finalized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The pending version expired (`version_expired`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is larger than `limits.maxFileBytes` (`file_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publish/{slug}/versions/{versionId}/finalize:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags: [Publish]
      operationId: finalizeVersion
      summary: Make a pending version live
      description: |
        Needs write on the site. Checks the limits again, then checks that every file exists with the right size
        and SHA-256. If any file is absent or damaged, the response is 409 `missing_files` with the paths in
        `missing`; upload those files again and retry. Then one transaction flips the site's live pointer. If the
        version was created with a `baseVersionId`, the transaction also requires that base to still be live and
        fails with 409 `version_conflict` otherwise, so exactly one of several racing finalisations succeeds.
        Afterwards the server deletes finalized versions beyond `retention.keepVersions`, never the live one.

        Calling finalize again on a finalized version returns the same result without changing anything.
        `live` tells whether the version is still the one served.
      responses:
        "200":
          description: The finalized version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `missing_files` lists the paths to upload again in `missing`. `version_conflict` carries the live
            version in `currentVersionId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The pending version expired (`version_expired`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PublishTooLarge"
  /publish/{slug}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags: [Publish]
      operationId: restoreVersion
      summary: Make an older finalized version live again
      description: |
        Needs write on the site. Flips the live pointer in one statement and uploads nothing. Restoring the
        live version succeeds without change. Pending versions cannot be restored.
      responses:
        "200":
          description: The restored version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The version is still pending (`version_not_finalized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publish/{slug}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
      - $ref: "#/components/parameters/VersionId"
    delete:
      tags: [Publish]
      operationId: deleteVersion
      summary: Delete a version
      description: |
        Needs write on the site. Removes the version and its files. The live version cannot be deleted, so
        restore another one first.
      responses:
        "204":
          description: Version deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The version is live (`version_live`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publish/{slug}/access:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
    get:
      tags: [Access]
      operationId: getAccess
      summary: Read a site's access settings
      description: |
        Needs read on the site. The response never contains the password or its hash, only whether a password
        is set.
      responses:
        "200":
          description: The access settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Access]
      operationId: updateAccess
      summary: Change a site's access settings
      description: |
        Needs write on the site. Omitted fields stay as they are. `emailAllowlist` and `domainAllowlist` replace
        the whole list. `password` sets the password, or clears it when null. Switching to `password` mode needs
        a password to exist after the change.

        Changing the mode, the password or either list moves the site's access epoch, which invalidates every
        viewer cookie and unused email code and handoff token for the site. Sending a value the site already has
        changes nothing, except a password, which always counts as a change.

        An empty allowlist in `restricted` mode means members only: only instance users with at least read access
        to the site can open it.

        Passwords need 8 to 128 characters. Each list holds at most 500 entries. Emails are ASCII and stored in
        lower case. A domain such as `example.com` (a leading `@` is accepted) matches addresses at exactly that
        domain, not its subdomains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessRequest"
      responses:
        "200":
          description: The access settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServerBusy"
  /access/handoff:
    get:
      tags: [Access]
      operationId: accessHandoff
      summary: Sign an instance user in to a restricted site
      security: []
      description: |
        Used by the sign-in link on a restricted site's gate page. Without credentials the response is a 303
        redirect to `/login?next=<this request>`. The login page ships with the dashboard, so until then the
        interactive path works only for users who already have a session in the browser.

        With a session cookie or API key and read access to the site, the response is a 303 redirect to the site
        host. For a `restricted` site that is `{site url}.well-known/selfhost-auth?token=...&return=...`, where the
        token works once, for 60 seconds, for this site only. The site host exchanges it for a viewer cookie and
        redirects to `return`. For a `public` or `password` site there is nothing to exchange, so the redirect goes
        straight to `{site url}` plus `return`. Calls are limited to 30 per minute per user.

        `return` must be a path on the site that starts with one `/`. The server rejects absolute URLs,
        protocol-relative URLs, backslashes, control characters, fragments, `.` and `..` segments, and any of these
        after up to three rounds of percent-decoding, with 400 `validation_failed`.
      parameters:
        - name: site
          in: query
          required: true
          description: The site slug or id.
          schema:
            type: string
        - name: return
          in: query
          required: false
          description: The path, with an optional query, to open after sign-in. Defaults to `/`.
          schema:
            type: string
        - name: host
          in: query
          required: false
          description: |
            A verified custom domain of the site, such as `docs.example.org`. The gate page of a site opened on a
            custom domain sends it so the redirect goes back to that domain. Without it the redirect goes to the
            site's subdomain or path address (or, when neither is enabled, to a custom domain). The server accepts
            exactly the site's own verified domains, and only while `hosting.customDomainsEnabled` is true. Any
            other value, including a pending domain, a domain of another site and any value with a scheme, port,
            path or credentials, returns 400 `validation_failed`. Nothing is redirected to an unlisted host.
          schema:
            type: string
      responses:
        "303":
          description: Redirect to the login page or to the site host.
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /sites/{slug}/files:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
    get:
      tags: [Sites]
      operationId: listFileInfos
      summary: List the files of the live version
      description: |
        Needs read on the site. `versionId` is null and `files` is empty while the site has no live version.
        Agents use this to reconcile their local folder after a `version_conflict`.
      responses:
        "200":
          description: The live manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveManifest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /sites/{slug}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
      - name: path
        in: path
        required: true
        description: A file path from the live manifest, with each segment URL-encoded.
        schema:
          type: string
    get:
      tags: [Sites]
      operationId: getFileInfo
      summary: Download a file of the live version
      description: |
        Needs read on the site. The response is always `application/octet-stream` with
        `Content-Disposition: attachment`, whatever the file's recorded content type, so a stored HTML file cannot
        run on the API origin. It supports `Range` requests and sets `ETag` to the quoted SHA-256.
      responses:
        "200":
          description: The raw file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: A byte range of the file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /sites/{slug}/domains:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
    get:
      tags: [Domains]
      operationId: listDomains
      summary: List a site's custom domains
      description: |
        Needs read on the site. Domains are listed oldest first, pending and verified together.
      responses:
        "200":
          description: The custom domains.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Domains]
      operationId: createDomain
      summary: Claim a custom domain for a site
      description: |
        Needs write on the site. The domain is normalised to lower case ASCII (internationalised names become
        punycode) and a trailing dot is removed. The server rejects IP addresses, wildcards, names with a port,
        scheme or path, names with fewer than two labels, `localhost`, reserved top-level domains such as
        `.local`, `.internal` and `.test`, the host of `PUBLIC_URL`, and the base domain and every name under it,
        with 400 `validation_failed`.

        The new domain is `pending_verification` and serves nothing. Publish the `challenge` TXT record, then call
        `POST /sites/{slug}/domains/{id}/verify`. Other sites can claim the same name while it is pending, so a pending claim
        cannot block the real owner. The first site whose TXT record verifies takes the name, and the server deletes
        every competing pending claim. A pending claim that is not verified within 7 days is released.

        A name that a site has already verified returns 409 `domain_taken`, and so does a second claim of the same
        name by the same site. The response does not say which site holds the name.
        A site that already holds `hosting.maxDomainsPerSite` domains gets 409 `domain_limit_reached`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
      responses:
        "201":
          description: The claimed domain with its challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The domain is taken (`domain_taken`) or the site is at its limit (`domain_limit_reached`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /sites/{slug}/domains/{id}:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
      - $ref: "#/components/parameters/DomainId"
    get:
      tags: [Domains]
      operationId: getDomain
      summary: Read a custom domain
      description: Needs read on the site.
      responses:
        "200":
          description: The domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Domains]
      operationId: updateDomain
      summary: Make a domain the site's primary domain, or clear it
      description: |
        Needs write on the site. At most one domain per site is primary, and setting a new one clears the old one
        in the same step. Only a verified domain can be primary (409 `domain_not_verified` otherwise). A domain
        that drops back to pending stops being primary. The primary domain is the address the site reports in
        `url`. Every verified domain serves the site, and none redirects to another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
      responses:
        "200":
          description: The domain after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The domain is not verified (`domain_not_verified`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Domains]
      operationId: deleteDomain
      summary: Delete a custom domain
      description: |
        Needs write on the site. The domain stops serving at once and its name is free for any site to claim.
        Deleting is the only way to release a verified domain.
      responses:
        "204":
          description: The domain is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /sites/{slug}/domains/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
      - $ref: "#/components/parameters/DomainId"
    post:
      tags: [Domains]
      operationId: verifyDomain
      summary: Check the domain's TXT record
      description: |
        Needs write on the site. The server looks up the TXT records at `challenge.name` and marks the domain
        verified when one holds `challenge.value` exactly. It does not look at where the domain's A, AAAA or
        CNAME records point, so a domain behind a CDN or proxy verifies as well.

        The response is 200 whether or not the check passed. `verified` says which, and `message` explains a
        failed check in plain language: no record yet, records that do not match, or a DNS lookup that failed
        or timed out. DNS changes can take a while to spread, so a new record may need several tries. Calling
        this on a verified domain re-checks it, records the result, and never removes the verification. The
        daily re-verification does that. Calls are limited to 20 per minute per user.
      responses:
        "200":
          description: The check ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerifyResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /invites:
    get:
      tags: [Invites]
      operationId: listInvites
      summary: List invites
      description: |
        The root user sees every invite. Everyone else sees the invites they sent. Newest first, at most 500.
        Links are never listed, because the server stores only a hash of each token.
      responses:
        "200":
          description: Invites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Invites]
      operationId: createInvite
      summary: Invite someone to create an account
      description: |
        The root user may always invite, into any shared workspace or none. With the instance setting
        `invites.whoCanInvite` set to `workspaceAdmins`, a workspace admin may also invite, but only into a
        workspace they administer (404 for a workspace they cannot see, 403 for one where their role is too low or
        when no workspace is named). Under the default `root`, everyone else gets 403 `forbidden`.

        The response always carries the invite link, whether or not email is configured, and shows it once. If
        email is configured and `sendEmail` is true, the server also emails the link. `emailAvailable` tells a
        client whether to offer that option. If sending fails, the invite still exists, `emailSent` is false and
        `emailError` holds a short reason.

        An address that already has an account returns 409 `email_registered`. An invite lasts 7 days. Creating
        and resending are limited to 30 per hour per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `email_registered` (the address has an account; add the user to the workspace instead) or
            `personal_workspace` (a personal workspace cannot take members).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /invites/{invite}:
    parameters:
      - name: invite
        in: path
        required: true
        description: The invite token for GET, the invite id for DELETE.
        schema:
          type: string
    get:
      tags: [Invites]
      operationId: getInvite
      summary: Look up an invite by its token
      description: |
        Needs no credentials. Returns only the invited email address and the workspace name. Unknown, expired,
        revoked and used tokens all return the same 404. Rate limited per IP address (60 per minute).
      security: []
      responses:
        "200":
          description: The invite is usable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Invites]
      operationId: revokeInvite
      summary: Revoke an invite
      description: |
        The root user may revoke any invite, everyone else only their own. Revoking a revoked or expired invite
        succeeds. An accepted invite returns 409 `invite_accepted`.
      responses:
        "204":
          description: Invite revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The invite was already accepted (`invite_accepted`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invites/{invite}/accept:
    post:
      tags: [Invites]
      operationId: acceptInvite
      summary: Accept an invite and create the account
      description: |
        Needs no credentials. Creates the user with the invited email address, their personal workspace and, if
        the invite names a workspace, the membership with the invited role, in one transaction. Then it signs the
        user in and sets the session cookie. The invitee cannot change the email address. A password under 12
        characters returns 400 and leaves the invite usable. Unknown, expired, revoked and used tokens return the
        same 404. Rate limited per IP address (10 in 15 minutes).
      security: []
      parameters:
        - name: invite
          in: path
          required: true
          description: The invite token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          description: Account created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerBusy"
  /invites/{invite}/resend:
    post:
      tags: [Invites]
      operationId: resendInvite
      summary: Replace an invite with a new link
      description: |
        Revokes the old token and issues a new invite with the same email, workspace and role, valid for 7 days.
        The response has the same shape as creating an invite and shows the new link once. The caller needs the
        same permission as for creating the invite. An accepted invite returns 409 `invite_accepted`. The body is
        optional.
      parameters:
        - name: invite
          in: path
          required: true
          description: The invite id.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendInviteRequest"
      responses:
        "201":
          description: New invite issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: '`invite_accepted`, or `email_registered` because the address has an account now.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /sites/{slug}/analytics:
    parameters:
      - $ref: "#/components/parameters/SiteSlug"
      - $ref: "#/components/parameters/AnalyticsFrom"
      - $ref: "#/components/parameters/AnalyticsTo"
      - $ref: "#/components/parameters/AnalyticsInterval"
      - $ref: "#/components/parameters/AnalyticsTop"
    get:
      tags: [Analytics]
      operationId: getSiteAnalytics
      summary: Read a site's analytics
      description: |
        Needs read on the site. Counts the HTML pages the server served, with the numbers and rules described under
        the `Analytics` schema. Turning analytics off for a site stops new counting and keeps what was recorded.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspace}/analytics:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/AnalyticsFrom"
      - $ref: "#/components/parameters/AnalyticsTo"
      - $ref: "#/components/parameters/AnalyticsInterval"
      - $ref: "#/components/parameters/AnalyticsTop"
    get:
      tags: [Analytics]
      operationId: getWorkspaceAnalytics
      summary: Read a workspace's analytics
      description: |
        Needs a workspace-wide role (read, write or admin). A user whose access is limited to folders or single sites
        gets 403 `forbidden`. The report adds up the sites in the workspace that the user can see. It works the same for
        a personal workspace. Unique counts add up per site, so a visitor who opens two sites counts twice.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/analytics:
    parameters:
      - $ref: "#/components/parameters/AnalyticsFrom"
      - $ref: "#/components/parameters/AnalyticsTo"
      - $ref: "#/components/parameters/AnalyticsInterval"
      - $ref: "#/components/parameters/AnalyticsTop"
    get:
      tags: [Analytics]
      operationId: getInstanceAnalytics
      summary: Read the analytics of the whole instance
      description: |
        Root user only. Every other user gets 404 `not_found`. The report adds up every site and includes
        `droppedEvents`.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/settings:
    get:
      tags: [Admin]
      operationId: getSettings
      summary: Read the instance settings
      description: |
        Root user only. Every other user gets 404 `not_found`, as if the route did not exist. Values that were never
        set show their defaults.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin]
      operationId: updateSettings
      summary: Change instance settings
      description: |
        Root user only. Send only the keys to change. The server validates all of them first and applies none if
        one is invalid. Unknown keys and the read-only `hosting.wildcard*` keys are rejected with 400
        `validation_failed`. Changes apply to the next request.

        Setting `hosting.subdomainEnabled` to true returns 409 `wildcard_not_verified` unless the last wildcard
        check succeeded. A change that would leave both `hosting.subdomainEnabled` and `hosting.pathEnabled` false
        returns 409 `no_hosting_mode`. The server judges the stored values merged with the patch, so one patch can
        switch one mode on and the other off.

        Changing `hosting.baseDomain` to a different effective value resets the check to `unchecked` and switches
        subdomain mode off. When that would leave both modes off, the server also switches path mode on in the same
        change and returns a notice with the code `path_mode_enabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: All settings after the change, and any notices about side effects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSettingsEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/HostingConflict"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /admin/email/test:
    post:
      tags: [Admin]
      operationId: sendTestEmail
      summary: Send a test email to the root user
      description: |
        Root user only. Other users get 404 `not_found`. Sends a short message to the root user's address through
        the configured provider. Rate limited to 5 calls per minute. A failure returns 502 `email_send_failed`
        with a short reason in the message, such as "the server rejected the username or password". The reason
        never includes a secret or the server's raw reply. Without working email settings the route returns 409
        `email_not_configured`.
      responses:
        "200":
          description: The message was handed to the provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Email is not configured (`email_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: The provider refused or could not be reached (`email_send_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List every account
      description: Root user only. Other users get 404 `not_found`. Ordered by email address.
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}:
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Disable or enable an account
      description: |
        Root user only. Other users get 404 `not_found`. A disabled user cannot sign in. Their sessions end and
        their API keys stop working at once. Enabling restores the keys, not the sessions. The root user cannot
        disable themselves (409 `cannot_disable_self`), and the last root user cannot be disabled (409
        `last_root`). The API has no way to delete a user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The account after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: '`cannot_disable_self` or `last_root`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /admin/users/{id}/password-reset:
    post:
      tags: [Admin]
      operationId: createPasswordResetLink
      summary: Generate a password reset link for an account
      description: |
        Root user only. Other users get 404 `not_found`. Works without email. The response shows the link once,
        and the root user passes it on. The link works once and for one hour, and replaces earlier unused links of
        that user. A disabled account returns 409 `user_disabled`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Link created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetLink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is disabled (`user_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hosting/status:
    get:
      tags: [Hosting]
      operationId: getHostingStatus
      summary: Read the instance hosting status
      description: |
        Any signed-in user. Reports the state of each hosting mode, plain-language notices and whether hosting is
        degraded. It names no site. The root user also gets a `detail` object with the wildcard check status, when
        it last ran, the failure text, the consecutive failure count, the reason subdomain mode was switched
        off and the certificate state under `detail.tls`. Other users never get `detail`. When built-in TLS is on,
        subdomain mode is on and the wildcard certificate is missing or failing, every user gets the notice
        `tls_wildcard_unavailable`.
      responses:
        "200":
          description: The hosting status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostingStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /admin/hosting/check:
    post:
      tags: [Admin]
      operationId: checkWildcard
      summary: Check that wildcard subdomains reach this server
      description: |
        Root user only. Other users get 404 `not_found`. Picks a random label, resolves `{label}.{baseDomain}`
        through DNS, then requests `{PUBLIC_URL scheme}://{label}.{baseDomain}/.well-known/selfhost-check/{token}`
        and succeeds only if the server itself answers with the HMAC of the one-time token (the key stays in the process). The check never follows
        redirects, reads at most 256 bytes and gives up after 10 seconds. It stores the outcome in the read-only
        `hosting.wildcard*` settings. A failed check never switches subdomain mode off by itself, and a manual
        check does not count toward the automatic switch-off. The server also runs the check at startup and every
        6 hours, retries every 15 minutes while it fails, and switches subdomain mode off after 3 consecutive
        failed startup or scheduled checks when path mode is on. Rate limited to 6 calls per minute per user.

        A failed check is a normal 200 response with `status` set to `failed`. The `.well-known/selfhost-check/`
        route on site hosts is the only unauthenticated route this feature adds. It answers only while a check
        is running, once per token, and returns the generic 404 otherwise.
      responses:
        "200":
          description: The outcome, and all settings after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WildcardCheckResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key created with `POST /me/keys`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        Set by `POST /setup` and `POST /auth/login`. HttpOnly and SameSite=Lax. Over HTTPS the cookie is named
        `__Host-session`, is Secure, has Path=/ and carries no Domain attribute. Over plain HTTP (local use) the name is
        `session`. The server reads only the form that matches the request, so a `session` cookie set by a sibling
        subdomain is ignored over HTTPS.
  parameters:
    SiteSlug:
      name: slug
      in: path
      required: true
      description: The site slug or id.
      schema:
        type: string
    VersionId:
      name: versionId
      in: path
      required: true
      description: A version id returned by a publish call.
      schema:
        type: string
    DomainId:
      name: id
      in: path
      required: true
      description: A domain id from the domain list.
      schema:
        type: string
    Workspace:
      name: workspace
      in: path
      required: true
      description: The workspace slug or id.
      schema:
        type: string
    AnalyticsFrom:
      name: from
      in: query
      required: false
      description: |
        First day of the range, as an RFC 3339 date (`2026-03-01`) or timestamp (converted to its UTC date).
        Defaults to 29 days before `to`.
      schema:
        type: string
    AnalyticsTo:
      name: to
      in: query
      required: false
      description: Last day of the range, inclusive, in the same formats as `from`. Defaults to today in UTC.
      schema:
        type: string
    AnalyticsInterval:
      name: interval
      in: query
      required: false
      description: |
        `day` (default) or `hour`. `hour` needs a range of 14 days or less. Hourly points come from raw events, which
        the server keeps for `analytics.rawDays` days (at least 14).
      schema:
        type: string
        enum: [day, hour]
    AnalyticsTop:
      name: top
      in: query
      required: false
      description: How many entries each ranked list returns, 1 to 50. Defaults to 10.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  headers:
    SessionCookie:
      description: The session cookie, named `__Host-session` over HTTPS and `session` over plain HTTP.
      schema:
        type: string
  responses:
    BadRequest:
      description: |
        The request was rejected. The `code` is one of `invalid_json` (400), `validation_failed` (400),
        `body_too_large` (413) or `unsupported_media_type` (415).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PublishInvalid:
      description: |
        The request was rejected. The `code` is `invalid_json`, `validation_failed` (a malformed hash, size or
        content type, or an empty file list) or `invalid_path` (a path that breaks the rules on `FileSpec.path`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PublishTooLarge:
      description: |
        A limit from the instance settings was exceeded: `too_many_files`, `file_too_large` or
        `version_too_large`. `body_too_large` (a manifest over 16 MiB) also returns 413.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VersionConflict:
      description: |
        The site's live version is not the `baseVersionId` sent (`version_conflict`). `currentVersionId` names the
        live version, or is absent when the site has none.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid session or API key (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CsrfRejected:
      description: A cookie-authenticated request lacked `X-Requested-With` or a same-host `Origin` (`csrf_rejected`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Either a cookie-authenticated request lacked `X-Requested-With` or a same-host `Origin` (`csrf_rejected`),
        or the user can see the resource but their role does not allow the action (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        The resource does not exist or the user cannot see it (`not_found`). The two cases are indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HostingConflict:
      description: |
        Subdomain mode cannot be enabled until a wildcard check succeeds (`wildcard_not_verified`), or the change
        would leave both hosting modes off (`no_hosting_mode`), or the new base domain collides with a custom
        domain (`base_domain_in_use`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts (`rate_limited`). Limits are held in memory, per process, and reset on restart.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyPending:
      description: |
        Too many unfinished versions (`too_many_pending`). A site may hold 3 pending versions, a user 10, and
        all pending versions together may declare at most `limits.maxPendingBytes`. Finalize or delete a pending
        version, or wait for it to expire after 24 hours. The message names the limit in plain words and does not
        name other users or sites.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerBusy:
      description: Password hashing is saturated (`server_busy`). The request waited 5 seconds for a free slot. Retry after the interval in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable snake_case identifier.
          enum:
            - invalid_json
            - validation_failed
            - unsupported_media_type
            - body_too_large
            - unauthenticated
            - invalid_credentials
            - invalid_setup_token
            - setup_complete
            - csrf_rejected
            - rate_limited
            - not_found
            - api_key_limit_reached
            - forbidden
            - slug_taken
            - folder_name_taken
            - last_admin
            - personal_workspace
            - workspace_not_empty
            - member_exists
            - user_not_found
            - internal_error
            - version_conflict
            - too_many_files
            - version_too_large
            - file_too_large
            - hash_mismatch
            - size_mismatch
            - missing_files
            - invalid_path
            - version_finalized
            - version_expired
            - version_live
            - version_not_finalized
            - file_not_in_manifest
            - wildcard_not_verified
            - no_hosting_mode
            - base_domain_in_use
            - domain_taken
            - domain_limit_reached
            - domain_not_verified
            - account_disabled
            - cannot_disable_self
            - last_root
            - user_disabled
            - invite_accepted
            - email_registered
            - invalid_reset_token
            - invalid_code
            - email_not_configured
            - email_send_failed
        message:
          type: string
        retry_after:
          type: integer
          description: Seconds to wait. Present on `rate_limited`.
        currentVersionId:
          type: string
          description: The site's live version. Present on `version_conflict` when the site has one.
        missing:
          type: array
          items:
            type: string
          description: Paths to upload again. Present on `missing_files`.
    Instance:
      type: object
      required: [publicUrl, version, emailAvailable, canCreateWorkspaces, hostingModes, maxDomainsPerSite, whoCanInvite, agentCredentialsDir, agentCredentialsPath]
      properties:
        publicUrl:
          type: string
          description: The address people use for the dashboard and the API, without a trailing slash.
          examples: ["https://sites.example.com"]
        version:
          type: string
          description: The server version, or `dev` for a development build.
        emailAvailable:
          type: boolean
          description: Whether the instance can send email now.
        canCreateWorkspaces:
          type: boolean
          description: Whether the caller may create shared workspaces. False when `workspaces.whoCanCreate` is `root` and the caller is not the root user.
        hostingModes:
          type: object
          required: [subdomain, path, customDomains]
          properties:
            subdomain:
              type: boolean
            path:
              type: boolean
            customDomains:
              type: boolean
        maxDomainsPerSite:
          type: integer
          description: The most custom domains one site can hold (`hosting.maxDomainsPerSite`).
        whoCanInvite:
          type: string
          enum: [root, workspaceAdmins]
          description: The `invites.whoCanInvite` setting. With `root`, only the root user may create invites.
        agentCredentialsDir:
          type: string
          examples: [".selfhost"]
        agentCredentialsPath:
          type: string
          examples: ["~/.selfhost/credentials"]
    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean
    SetupRequest:
      type: object
      additionalProperties: false
      required: [email, password, setupToken]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: ASCII only. Stored in lower case.
          examples: [alex@example.com]
        password:
          type: string
          minLength: 12
          maxLength: 128
        setupToken:
          type: string
          description: The token the server logged at startup.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          examples: [alex@example.com]
        password:
          type: string
    User:
      type: object
      required: [id, email, displayName, isRoot, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
          description: Chosen when accepting an invite. Empty if none.
        isRoot:
          type: boolean
        createdAt:
          type: string
          format: date-time
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    Me:
      type: object
      required: [user, authMethod]
      properties:
        user:
          $ref: "#/components/schemas/User"
        authMethod:
          type: string
          enum: [session, apiKey]
    ApiKey:
      type: object
      required: [id, label, prefix, createdAt, lastUsedAt, revokedAt]
      properties:
        id:
          type: string
        label:
          type: string
        prefix:
          type: string
          description: The start of the key, for recognising it in a list.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.
        revokedAt:
          type: [string, "null"]
          format: date-time
    ApiKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          examples: [ci runner]
    CreatedApiKey:
      type: object
      required: [key, apiKey]
      properties:
        key:
          type: string
          description: The full key. Shown once.
        apiKey:
          $ref: "#/components/schemas/ApiKey"
    Role:
      type: string
      enum: [admin, write, read]
      description: |
        `admin` manages members, grants, the workspace name and deletion, and applies to the whole workspace only.
        `write` creates, edits, moves and deletes sites and folders it covers. `read` views and searches.
    Workspace:
      type: object
      required: [id, slug, name, kind, role, scopedOnly, createdAt, updatedAt]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [personal, shared]
        role:
          $ref: "#/components/schemas/Role"
        scopedOnly:
          type: boolean
          description: True when the user holds only grants limited to folders or sites. `role` is then `read`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceEnvelope:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
    WorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Acme Ltd]
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: Optional. Derived from the name when omitted.
          examples: [acme]
    RenameWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    Member:
      type: object
      required: [id, userId, email, role, scopeType, scopeId, scopeName, createdAt]
      properties:
        id:
          type: string
          description: The grant id.
        userId:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        scopeType:
          type: string
          enum: [workspace, folder, site]
        scopeId:
          type: [string, "null"]
          description: The folder id or site id. Null for a workspace-wide grant.
        scopeName:
          type: [string, "null"]
          description: The folder name or site slug. Null for a workspace-wide grant.
        createdAt:
          type: string
          format: date-time
    MemberEnvelope:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"
    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          examples: [sam@example.com]
        role:
          $ref: "#/components/schemas/Role"
        scopeType:
          type: string
          enum: [workspace, folder, site]
          default: workspace
        scopeId:
          type: string
          description: A folder id, or a site id or slug. Required for folder and site grants and forbidden for workspace grants.
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    Folder:
      type: object
      required: [id, workspaceId, name, role, createdAt, updatedAt]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FolderEnvelope:
      type: object
      required: [folder]
      properties:
        folder:
          $ref: "#/components/schemas/Folder"
    FolderList:
      type: object
      required: [folders]
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
    FolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Reports]
    Site:
      type: object
      required: [id, workspaceId, workspaceSlug, folderId, slug, displayName, description, createdBy, spaMode, analyticsEnabled, accessMode, currentVersionId, url, hosting, role, createdAt, updatedAt]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        workspaceSlug:
          type: string
        folderId:
          type: [string, "null"]
          description: Null for an unfiled site.
        slug:
          type: string
          description: Unique across the instance. Never changes.
        displayName:
          type: string
        description:
          type: string
        createdBy:
          type: [string, "null"]
          description: The creating user's id.
        spaMode:
          type: boolean
          description: Serve `index.html` with status 200 for unknown paths whose last segment has no file extension.
        analyticsEnabled:
          type: boolean
          description: |
            Whether the server counts page views for this site. New sites take the value of the
            `analytics.enabledByDefault` setting. Turning it off stops counting and keeps the data already recorded.
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        currentVersionId:
          type: [string, "null"]
          description: The live version. Null until a version is finalized.
        url:
          $ref: "#/components/schemas/SiteUrl"
        hosting:
          $ref: "#/components/schemas/SiteHosting"
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Domain:
      type: object
      required: [id, domain, status, challenge, target, isPrimary, verifiedAt, lastCheckedAt, lastCheckResult, createdAt]
      properties:
        id:
          type: string
        domain:
          type: string
          description: The normalised name, in lower case ASCII.
        status:
          type: string
          enum: [pending_verification, verified]
          description: Only a verified domain serves the site.
        challenge:
          type: object
          required: [recordType, name, value]
          description: The DNS record that proves control of the domain.
          properties:
            recordType:
              type: string
              enum: [TXT]
            name:
              type: string
              description: Always `_selfhost-challenge.` followed by the domain.
            value:
              type: string
              description: A random token of 192 bits in hex. It is not a secret, but nobody can guess it.
        target:
          type: object
          required: [recordType, value, note]
          description: Where to point the domain so visitors reach this server. Verification does not depend on it.
          properties:
            recordType:
              type: string
              enum: [CNAME]
            value:
              type: string
              description: The host name of `PUBLIC_URL`.
            note:
              type: string
              description: Plain-language advice for apex domains and domains behind a CDN.
        isPrimary:
          type: boolean
        verifiedAt:
          type: [string, "null"]
          format: date-time
        lastCheckedAt:
          type: [string, "null"]
          format: date-time
          description: When the TXT record was last looked up, by a verify call or the daily re-check.
        lastCheckResult:
          type: [string, "null"]
          enum: [verified, record_not_found, token_mismatch, lookup_failed, null]
          description: |
            The outcome of the last lookup. `record_not_found` means the lookup succeeded and found no TXT record
            (or the name does not exist). `token_mismatch` means TXT records exist and none holds the token.
            `lookup_failed` means the lookup timed out or the resolver failed, which says nothing about the record.
        createdAt:
          type: string
          format: date-time
    DomainEnvelope:
      type: object
      required: [domain]
      properties:
        domain:
          $ref: "#/components/schemas/Domain"
    DomainList:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
    CreateDomainRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          description: A bare domain name such as `docs.example.org`.
    UpdateDomainRequest:
      type: object
      additionalProperties: false
      required: [isPrimary]
      properties:
        isPrimary:
          type: boolean
    DomainVerifyResult:
      type: object
      required: [domain, verified, message]
      properties:
        domain:
          $ref: "#/components/schemas/Domain"
        verified:
          type: boolean
          description: True when the domain is verified after this call.
        message:
          type: string
          description: A plain-language account of the last lookup.
    AccessMode:
      type: string
      enum: [public, password, restricted]
      description: |
        `public` serves the site to anyone with the link. `password` asks for the site's password. `restricted` lets
        in instance users with at least read access to the site, and the viewers on its email and domain
        allowlists, who sign in with an emailed code.
    Access:
      type: object
      required: [mode, hasPassword, emailAllowlist, domainAllowlist, emailCodeAvailable]
      properties:
        mode:
          $ref: "#/components/schemas/AccessMode"
        hasPassword:
          type: boolean
          description: Whether a password is stored. The password itself is never returned.
        emailAllowlist:
          type: array
          maxItems: 500
          items:
            type: string
            format: email
        domainAllowlist:
          type: array
          maxItems: 500
          items:
            type: string
        emailCodeAvailable:
          type: boolean
          description: |
            Whether this instance can email sign-in codes. It is false until an email sender is configured. Allowlisted
            addresses are still stored when it is false, but their owners cannot sign in with a code.
    AccessEnvelope:
      type: object
      required: [access]
      properties:
        access:
          $ref: "#/components/schemas/Access"
    UpdateAccessRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/AccessMode"
        password:
          type: [string, "null"]
          minLength: 8
          maxLength: 128
          description: The new password, or null to remove it.
        emailAllowlist:
          type: array
          maxItems: 500
          items:
            type: string
          description: Replaces the list.
        domainAllowlist:
          type: array
          maxItems: 500
          items:
            type: string
          description: Replaces the list.
    SiteUrl:
      type: [string, "null"]
      description: |
        Where the instance serves the site right now. In order: the primary custom domain (`https://{domain}/`)
        when custom domains are enabled and one is primary, else `https://{slug}.{baseDomain}/` when subdomain
        mode is enabled, else `{publicUrl}/s/{slug}/` when path mode is enabled, else the first verified custom
        domain by name, else null. A custom domain uses the scheme of `PUBLIC_URL` and no port. The URL does not say whether
        the site has a live version. A site without one answers 404.
    SiteEnvelope:
      type: object
      required: [site]
      properties:
        site:
          $ref: "#/components/schemas/Site"
    SiteList:
      type: object
      required: [sites, nextCursor]
      properties:
        sites:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        nextCursor:
          type: [string, "null"]
    CreateSiteRequest:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: |
            Lowercase letters, digits and hyphens, with no leading or trailing hyphen. Reserved words such as
            `www`, `api`, `app`, `admin`, `dashboard`, `mail`, `static`, `assets`, `docs`, `status`, `login`,
            `setup` and `settings` are rejected, as is any 32-character hex string. Generated when omitted.
          examples: [launch-page]
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Defaults to the slug.
        description:
          type: string
          maxLength: 1000
        folderId:
          type: string
          description: A folder in the same workspace. Omit for an unfiled site.
        spaMode:
          type: boolean
          default: false
    UpdateSiteRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        folderId:
          type: [string, "null"]
          description: A folder in the same workspace, or null for unfiled.
        spaMode:
          type: boolean
        analyticsEnabled:
          type: boolean
          description: Switch page view counting for this site on or off.
    FileSpec:
      type: object
      additionalProperties: false
      required: [path, size, sha256]
      properties:
        path:
          type: string
          maxLength: 1024
          description: |
            A relative path with `/` separators, at most 1024 bytes, each segment 1 to 255 bytes. The server rejects
            empty and absolute paths, `.` and `..` segments, empty segments, backslashes, NUL, control and invisible
            formatting characters, and invalid UTF-8 (`invalid_path`). Dotfiles and dot-directories such as
            `.well-known/` are allowed. No two paths may differ only in letter case, and no path may also be
            the directory of another.
          examples: [assets/app.js]
        size:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: Hex digest of the file content. Stored in lower case.
        contentType:
          type: string
          maxLength: 255
          description: A media type. Guessed from the file extension when omitted.
          examples: [text/html; charset=utf-8]
    PublishRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        workspace:
          type: string
          description: Workspace slug or id. Defaults to the `X-Workspace` header, then the caller's personal workspace.
        slug:
          type: string
          description: Same rules as `CreateSiteRequest.slug`. Generated when omitted.
        folder:
          type: string
          description: A folder id or name in the workspace. Omit for an unfiled site.
        displayName:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        spaMode:
          type: boolean
          default: false
        files:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FileSpec"
    RepublishRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        baseVersionId:
          type: string
          description: The live version the new files were built from. Enables conflict detection.
        files:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FileSpec"
    Upload:
      type: object
      required: [path, method, url, headers]
      properties:
        path:
          type: string
        method:
          type: string
          enum: [PUT]
        url:
          type: string
          description: A path on this API. Send the same credentials as for other calls.
        headers:
          type: object
          additionalProperties:
            type: string
    PublishResponse:
      type: object
      required: [slug, siteId, versionId, expiresAt, uploads, finalizeUrl, url, hosting]
      properties:
        slug:
          type: string
        siteId:
          type: string
        versionId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: The version expires after this time unless finalized.
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/Upload"
        finalizeUrl:
          type: string
        url:
          $ref: "#/components/schemas/SiteUrl"
        hosting:
          $ref: "#/components/schemas/SiteHosting"
    Version:
      type: object
      required: [id, siteId, status, live, createdBy, createdAt, finalizedAt, fileCount, totalBytes, baseVersionId]
      properties:
        id:
          type: string
        siteId:
          type: string
        status:
          type: string
          enum: [pending, finalized]
        live:
          type: boolean
          description: True for the version the site currently serves. Derived from the site, not stored.
        createdBy:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        finalizedAt:
          type: [string, "null"]
          format: date-time
        fileCount:
          type: integer
        totalBytes:
          type: integer
          format: int64
        baseVersionId:
          type: [string, "null"]
    VersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/Version"
    VersionResult:
      type: object
      required: [slug, url, hosting, version]
      properties:
        slug:
          type: string
        url:
          $ref: "#/components/schemas/SiteUrl"
        hosting:
          $ref: "#/components/schemas/SiteHosting"
        version:
          $ref: "#/components/schemas/Version"
    FileInfo:
      type: object
      required: [path, size, sha256, contentType]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        contentType:
          type: string
    FileEnvelope:
      type: object
      required: [file]
      properties:
        file:
          $ref: "#/components/schemas/FileInfo"
    LiveManifest:
      type: object
      required: [versionId, files]
      properties:
        versionId:
          type: [string, "null"]
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileInfo"
    SettingsEnvelope:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/Settings"
    UpdateSettingsEnvelope:
      type: object
      required: [settings, notices]
      properties:
        settings:
          $ref: "#/components/schemas/Settings"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
          description: Side effects of the change. Empty when there were none.
    Notice:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            A stable code such as `path_mode_enabled`, `no_live_version`, `subdomain_off`, `custom_domain_pending`
            (a custom domain is waiting for DNS verification) or `custom_domains_off`.
        message:
          type: string
          description: A plain-language sentence for any user. It contains no administrator detail.
    HostingMode:
      type: object
      required: [state, reason]
      properties:
        state:
          type: string
          enum: [on, off]
        reason:
          type: [string, "null"]
          enum: [switched_off, wildcard_check_failed, https_required, not_applicable, null]
          description: |
            Null when the mode is on and healthy. `switched_off`: an administrator turned the mode off.
            `wildcard_check_failed`: the mode is off because repeated checks failed, or on but the last check
            failed. `https_required`: path mode is on but cannot serve this restricted or password site over plain
            HTTP. `not_applicable`: subdomain mode has no base domain to use.
    HostingModes:
      type: object
      required: [subdomain, path, customDomains]
      properties:
        subdomain:
          $ref: "#/components/schemas/HostingMode"
        path:
          $ref: "#/components/schemas/HostingMode"
        customDomains:
          $ref: "#/components/schemas/HostingMode"
    SiteHosting:
      type: object
      required: [reachable, url, modes, notices]
      properties:
        reachable:
          type: boolean
          description: |
            True when the site has a live version and at least one mode can serve it now. A gated site does not
            count path mode over plain HTTP. A verified custom domain counts while custom domains are enabled,
            even when subdomain and path modes are off.
        url:
          $ref: "#/components/schemas/SiteUrl"
        modes:
          $ref: "#/components/schemas/HostingModes"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
          description: |
            Plain-language messages about this site's addresses, such as "The subdomain address for this site is
            switched off." and "Nothing has been published to this site yet." Every user with read access to the
            site gets the same notices.
    TlsDetail:
      type: object
      required: [enabled, managementCertificateExpiresAt, wildcard, customDomains, dnsProviderConfigured]
      description: |
        Certificate state for the root user. With built-in TLS off, `enabled` is false and the rest holds empty
        values, except `dnsProviderConfigured`, which still reflects the stored settings.
      properties:
        enabled:
          type: boolean
          description: Whether the server runs with `TLS_ENABLED`.
        managementCertificateExpiresAt:
          type: [string, "null"]
          format: date-time
          description: When the certificate for the host of `PUBLIC_URL` expires. Null until one is loaded.
        wildcard:
          type: object
          required: [state, reason]
          properties:
            state:
              type: string
              enum: [none, pending, ok, failed]
              description: |
                `none` when no wildcard certificate is requested or held, `pending` while issuing, `ok` when a valid
                `*.{baseDomain}` certificate is loaded, `failed` after an issuance error (the server keeps retrying).
            reason:
              type: [string, "null"]
              description: A short plain-language reason for `none` or `failed`, with no provider output.
        customDomains:
          type: object
          required: [count, soonestExpiresAt]
          properties:
            count:
              type: integer
              minimum: 0
              description: Verified custom domains that have a valid certificate loaded.
            soonestExpiresAt:
              type: [string, "null"]
              format: date-time
        dnsProviderConfigured:
          type: boolean
          description: Whether `tls.dnsProvider` names a provider and a token is stored.
    HostingDetail:
      type: object
      required: [wildcardStatus, wildcardCheckedAt, wildcardDetail, consecutiveFailures, subdomainDisabledReason, tls]
      properties:
        tls:
          $ref: "#/components/schemas/TlsDetail"
        wildcardStatus:
          type: string
          enum: [unchecked, ok, failed]
        wildcardCheckedAt:
          type: [string, "null"]
          format: date-time
        wildcardDetail:
          type: string
        consecutiveFailures:
          type: integer
          minimum: 0
        subdomainDisabledReason:
          type: [string, "null"]
          enum: [wildcard_check_failed, null]
    HostingStatus:
      type: object
      required: [degraded, modes, notices]
      properties:
        degraded:
          type: boolean
          description: True while subdomain mode is on and its last wildcard check failed.
        modes:
          $ref: "#/components/schemas/HostingModes"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        detail:
          $ref: "#/components/schemas/HostingDetail"
    Settings:
      type: object
      additionalProperties: false
      properties:
        retention.keepVersions:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
          description: Finalized versions kept per site, counting the live one.
        limits.maxFilesPerVersion:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 2500
        limits.maxVersionBytes:
          type: integer
          format: int64
          minimum: 1
          default: 1073741824
          description: Total size of one version in bytes.
        limits.maxFileBytes:
          type: integer
          format: int64
          minimum: 1
          default: 268435456
          description: Size of one file in bytes. Also caps the upload request body.
        limits.maxPendingBytes:
          type: integer
          format: int64
          minimum: 0
          default: 4294967296
          description: |
            Total bytes that all pending versions of all sites may declare. A manifest that would pass this total is
            refused with 429 `too_many_pending`. 0 turns the limit off.
        limits.maxGateCodeMailsPerHour:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 100
          description: |
            Most sign-in code emails the instance sends for gated sites in one hour, counted in a fixed
            window. Past it, a code request gets the same answer as before and no email goes out. 0 turns the
            limit off. The per-site and per-address limits still apply.
        hosting.baseDomain:
          type: string
          description: |
            A bare host name such as `example.com`. Stored in lower case. Sites are served at `{slug}.{baseDomain}`.
            An empty value means the host name of the server's `PUBLIC_URL`, which is also what a new instance
            reports. A change is refused with 409 `base_domain_in_use` while a custom domain equals the new base
            domain or sits under it.
        hosting.subdomainEnabled:
          type: boolean
          default: false
          description: |
            Serve sites at `{slug}.{baseDomain}`. Needs wildcard DNS and, over HTTPS, a wildcard certificate. Can
            only be set to true while `hosting.wildcardStatus` is `ok`. A change that leaves it and
            `hosting.pathEnabled` both false returns 409 `no_hosting_mode`. After 3 consecutive failed startup or
            scheduled wildcard checks the server sets it to false, but only when path mode is on.
            Subdomain mode is the recommended way to host sites, because every site gets its own origin.
        hosting.pathEnabled:
          type: boolean
          default: true
          description: |
            Serve sites at `{publicUrl}/s/{slug}/`. Path-mode pages share an origin with the dashboard, so the server
            sends a `sandbox` Content-Security-Policy without `allow-same-origin` on every `/s/` response. The pages
            cannot use cookies, localStorage or the dashboard session. A change that leaves it and
            `hosting.subdomainEnabled` both false returns 409 `no_hosting_mode`.
        hosting.customDomainsEnabled:
          type: boolean
          default: true
          description: |
            Serve verified custom domains. Switching it off makes every custom host answer with the same 404 as an
            unknown host. Stored domains stay as they are, and the domain endpoints keep working. It has no effect
            on the rule that subdomain and path mode cannot both be off.
        hosting.maxDomainsPerSite:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: |
            The most custom domains one site can hold, pending and verified together. Lowering it keeps the
            domains a site already has and blocks new claims until it is under the limit.
        hosting.wildcardStatus:
          type: string
          enum: [unchecked, ok, failed]
          readOnly: true
          description: The outcome of the last wildcard check. Read-only.
        hosting.wildcardCheckedAt:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: When the last wildcard check finished. Null before the first one. Read-only.
        hosting.wildcardDetail:
          type: string
          readOnly: true
          description: Why the last check failed, or an empty string. Read-only.
        hosting.wildcardFailures:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            Consecutive failed startup or scheduled checks while subdomain mode was on. A passing check and a change of
            base domain reset it to 0. Manual checks do not change it. Read-only.
        hosting.subdomainDisabledReason:
          type: [string, "null"]
          enum: [wildcard_check_failed, null]
          readOnly: true
          description: |
            Set to `wildcard_check_failed` when the server switched subdomain mode off after repeated failed checks.
            A passing check clears it without switching the mode back on. Null otherwise. Read-only.
        sites.defaultAccessMode:
          type: string
          enum: [public, restricted]
          default: public
          description: |
            The access mode of sites created from now on. Existing sites keep theirs. `password` is not allowed as a
            default, because a password has to be set per site.
        invites.whoCanInvite:
          type: string
          enum: [root, workspaceAdmins]
          default: root
          description: |
            Who may create invites. With `workspaceAdmins`, a workspace admin may invite only into a workspace they
            administer. The root user may always invite.
        workspaces.whoCanCreate:
          type: string
          enum: [any, root]
          default: any
          description: Who may create shared workspaces.
        email.provider:
          type: string
          enum: [none, smtp, resend]
          default: none
        email.fromAddress:
          type: string
          description: Sender address, stored in lower case. Both providers need it.
        email.fromName:
          type: string
          maxLength: 100
          description: Optional sender name.
        email.smtp.host:
          type: string
          description: SMTP server host name or IP address.
        email.smtp.port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 587
        email.smtp.security:
          type: string
          enum: [tls, starttls, none]
          default: starttls
          description: '`tls` is implicit TLS (usually port 465). `starttls` upgrades the connection (usually port 587).'
        email.smtp.username:
          type: string
          description: Leave empty for a server without authentication.
        email.smtp.password:
          type: string
          writeOnly: true
          description: |
            The SMTP password. Write-only: reads never return it. An empty string clears it. The server stores it
            encrypted (AES-256-GCM).
        email.smtp.passwordSet:
          type: boolean
          readOnly: true
          description: Whether an SMTP password is stored.
        email.resend.apiKey:
          type: string
          writeOnly: true
          description: The Resend API key. Write-only. An empty string clears it. Stored encrypted.
        email.resend.apiKeySet:
          type: boolean
          readOnly: true
          description: Whether a Resend API key is stored.
        tls.dnsProvider:
          type: string
          enum: [none, cloudflare]
          default: none
          description: |
            The DNS provider that proves control of `*.{hosting.baseDomain}` for the wildcard certificate (DNS-01).
            Only used when the server runs with `TLS_ENABLED`. With `none`, no wildcard certificate is requested and
            subdomain sites are served over HTTPS only for names that already have a certificate.
        tls.cloudflareApiToken:
          type: string
          writeOnly: true
          description: |
            A Cloudflare API token with Zone:DNS:Edit and Zone:Zone:Read on the zone of the base domain. Write-only:
            reads never return it. An empty string clears it. Stored encrypted (AES-256-GCM) and read on every DNS
            call, so a new token applies without a restart.
        tls.cloudflareApiTokenSet:
          type: boolean
          readOnly: true
          description: Whether a Cloudflare API token is stored.
        analytics.enabledByDefault:
          type: boolean
          default: true
          description: Whether new sites count page views. Existing sites keep their own setting.
        analytics.retentionDays:
          type: integer
          default: 395
          description: |
            How many days of rolled-up analytics the server keeps: 0 keeps everything, otherwise 30 to 3650. The
            maintenance task deletes older rows.
        analytics.rawDays:
          type: integer
          minimum: 14
          maximum: 365
          default: 31
          description: |
            How many days of individual events the server keeps. Older days are kept only as daily rollups. Hourly
            charts need the raw events, so the minimum is 14 days.
        analytics.maxmindAccountId:
          type: string
          description: |
            The account ID of a MaxMind account (digits only). With the licence key, it lets the server download the
            GeoLite2 City database for country and city lookups. An empty string clears it.
        analytics.maxmindLicenseKey:
          type: string
          writeOnly: true
          description: The MaxMind licence key. Write-only. An empty string clears it. Stored encrypted (AES-256-GCM).
        analytics.maxmindLicenseKeySet:
          type: boolean
          readOnly: true
          description: Whether a MaxMind licence key is stored.
        analytics.geoStatus:
          type: string
          enum: [unconfigured, ok, failed]
          readOnly: true
          description: The outcome of the last GeoLite2 download attempt. `unconfigured` means no account ID and key are set.
        analytics.geoUpdatedAt:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: When the server last installed a GeoLite2 database. Null before the first download.
        analytics.geoCheckedAt:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: When the server last tried to download the database. Null before the first attempt.
        analytics.geoDetail:
          type: string
          readOnly: true
          description: Why the last attempt failed, or a note about the last download. Never contains the key.
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/Settings"
    Analytics:
      type: object
      required: [from, to, interval, totals, series, paths, referrers, countries, cities, browsers, operatingSystems, devices, statuses, locationAvailable, generatedAt]
      description: |
        A report counts HTML documents the server served to GET requests with status 200, plus custom `404.html` pages
        (status class `4xx`). It does not count assets, HEAD requests, partial (Range) or cached (304) responses,
        prefetches, gate pages and sign-in prompts of protected sites, or any request while analytics is off for the site.
        Visitors whose User-Agent looks like a bot are counted in `botViews` and in the `bot` device entry, and are left
        out of every other number. `4xx` pages appear only in `statuses`.

        A visitor hash exists for one site on one UTC day, so `uniques` for a range is the sum of the daily unique
        counts: a person who comes back on three days counts three times. Hourly unique counts can add up to more than
        the day's count for the same reason.

        Ranked lists are sorted by views, then by value. Empty referrers (direct visits) and unknown locations are left
        out of their lists. A rolled-up day keeps its top 500 values per list.
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        interval:
          type: string
          enum: [day, hour]
        totals:
          type: object
          required: [views, uniques, botViews]
          properties:
            views:
              type: integer
            uniques:
              type: integer
            botViews:
              type: integer
        series:
          type: array
          description: One point per day or hour in the range, including points with no traffic. `start` is in UTC.
          items:
            type: object
            required: [start, views, uniques]
            properties:
              start:
                type: string
                format: date-time
              views:
                type: integer
              uniques:
                type: integer
        paths:
          $ref: "#/components/schemas/AnalyticsRanked"
        referrers:
          $ref: "#/components/schemas/AnalyticsRanked"
        countries:
          $ref: "#/components/schemas/AnalyticsRanked"
        cities:
          $ref: "#/components/schemas/AnalyticsRanked"
        browsers:
          $ref: "#/components/schemas/AnalyticsRanked"
        operatingSystems:
          $ref: "#/components/schemas/AnalyticsRanked"
        devices:
          $ref: "#/components/schemas/AnalyticsRanked"
        statuses:
          $ref: "#/components/schemas/AnalyticsRanked"
        locationAvailable:
          type: boolean
          description: Whether the server has a GeoLite2 database. Without one, `countries` and `cities` stay empty.
        droppedEvents:
          type: integer
          description: |
            Root-only report only. Events the server could not record since it started, because its buffer was full or
            a database write failed. The count restarts at 0 on every start.
        generatedAt:
          type: string
          format: date-time
    AnalyticsRanked:
      type: array
      items:
        type: object
        required: [value, views, uniques]
        properties:
          value:
            type: string
          views:
            type: integer
          uniques:
            type: integer
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          examples: [alex@example.com]
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The token from the reset link.
        password:
          type: string
          minLength: 12
          maxLength: 128
    GenericStatus:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ok]
        message:
          type: string
    AgentRequestCode:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          examples: [alex@example.com]
    AgentVerifyCode:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          examples: [alex@example.com]
        code:
          type: string
          pattern: "^[0-9]{8}$"
          examples: ["12345678"]
        label:
          type: string
          maxLength: 64
          default: agent
          description: Label of the new key, shown in the key list.
    AgentKey:
      type: object
      required: [key, apiKey, credentialsPath]
      properties:
        key:
          type: string
          description: The full key. Shown once.
        apiKey:
          $ref: "#/components/schemas/ApiKey"
        credentialsPath:
          type: string
          description: Where agents store the key, as JSON with the instance URL and the key. The file mode is 0600.
          examples: ["~/.selfhost/credentials"]
    InviteWorkspace:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
    Invite:
      type: object
      required: [id, email, status, workspace, role, invitedBy, createdAt, expiresAt, acceptedAt, revokedAt]
      properties:
        id:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        workspace:
          oneOf:
            - $ref: "#/components/schemas/InviteWorkspace"
            - type: "null"
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
          description: The workspace-wide role the invitee gets. Null when the invite names no workspace.
        invitedBy:
          type: string
          description: Email address of the inviter.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          examples: [kim@example.com]
        workspace:
          type: string
          description: Slug or id of a shared workspace. Omit it to invite without a workspace.
        role:
          $ref: "#/components/schemas/Role"
        sendEmail:
          type: boolean
          default: false
          description: Email the link too. Ignored when email is not configured.
    ResendInviteRequest:
      type: object
      additionalProperties: false
      properties:
        sendEmail:
          type: boolean
          default: false
    CreatedInvite:
      type: object
      required: [invite, link, emailAvailable, emailSent, emailError]
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        link:
          type: string
          description: '`PUBLIC_URL/invite/<token>`. Shown once.'
        emailAvailable:
          type: boolean
          description: Whether the instance can send email. A client hides its email option when this is false.
        emailSent:
          type: boolean
        emailError:
          type: [string, "null"]
          description: A short reason when sending failed.
    InvitePreview:
      type: object
      required: [email, workspaceName]
      properties:
        email:
          type: string
        workspaceName:
          type: [string, "null"]
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          maxLength: 64
    EmailTestResult:
      type: object
      required: [sent, to]
      properties:
        sent:
          type: boolean
        to:
