name: Feature request
description: Suggest a change or addition
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The project is a self-hosted host for built static sites, for one person or a small team. It has no public sign-up, billing or profiles, and those are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why the current behaviour does not allow it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The change you suggest, including any API or setting it needs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
