name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $tag is not vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if [ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]; then
            echo "Tag $tag is not an annotated tag." >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the dashboard
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Build the binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="selfhost_${VERSION}_${os}_${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}/selfhost" ./cmd/openhere
            cp LICENSE README.md "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
            rm -r "dist/${name}"
          done
          cd dist
          sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Name the image
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${name}:${VERSION}"
          if [ "$PRERELEASE" = "false" ]; then
            minor="${VERSION%.*}"
            tags="${tags},${name}:${minor},${name}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}

  release:
    needs: [verify, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-files
          path: dist
      - name: Write the release notes
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for the changes in this release." > notes.md
          fi
          {
            echo
            echo "Container image: \`docker pull ${image}\`"
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS\`."
          } >> notes.md
      - name: Create the release
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $flags
