version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - unparam
  exclusions:
    rules:
      - path: internal/hosting/headers\.go
        linters:
          - gosec
        text: G705
      - path: internal/settings/email\.go
        linters:
          - gosec
        text: G101
      - path: _test\.go
        linters:
          - gosec
        text: G101
      - path: internal/settings/tls\.go
        linters:
          - gosec
        text: G101
      - path: internal/certs/manager\.go
        linters:
          - gosec
        text: G304
      - path: _test\.go
        linters:
          - gosec
        text: G402
      - path: _test\.go
        linters:
          - gosec
        text: G112|G301|G302|G304|G306
      - path: internal/fsperm/fsperm\.go
        linters:
          - gosec
        text: G304

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
