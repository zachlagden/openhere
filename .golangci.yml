version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - unparam
  exclusions:
    rules:
      - path: internal/hosting/headers\.go
        linters:
          - gosec
        text: G705

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
